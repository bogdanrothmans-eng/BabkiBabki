# Builds the static demo (demo/) and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://<owner>.github.io/<repo>/.
# One-time setup: Settings → Pages → Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root).
name: Demo on GitHub Pages

on:
  push:
    branches: [main, claude/affectionate-sagan-k2zs0e]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build demo
        run: npm run demo:build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Publish to gh-pages
        working-directory: demo/out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Next puts its assets in _next/, which Jekyll would otherwise drop.
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy demo from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
